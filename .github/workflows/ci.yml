name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Aggregates every job's result. This is the required check in the default branch's ruleset.
  # When adding a job, add it to needs as well.
  all-green:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done
